name: Deploy NewNetworkingBackend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR (GitHub Actions serverida)
        working-directory: NewNetworkingBackend
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

      - name: JAR faylni EC2'ga yuborish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "NewNetworkingBackend/build/libs/*.jar"
          target: "/home/ubuntu/app/NewNetworkingBackend/"
          strip_components: 3

      - name: EC2'da konteynerlarni qayta ishga tushirish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            # Swap tekshirish
            if [ $(sudo swapon --show | wc -l) -eq 0 ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            # Docker Compose formatini aniqlash
            if docker compose version &>/dev/null; then
              COMPOSE_CMD="sudo docker compose"
            else
              COMPOSE_CMD="sudo docker-compose"
            fi

            cd /home/ubuntu/app/NewNetworkingBackend

            # Faqat docker image rebuild (JAR allaqachon yuborilgan)
            $COMPOSE_CMD -f docker.compose.yml down
            $COMPOSE_CMD -f docker.compose.yml up -d --build
