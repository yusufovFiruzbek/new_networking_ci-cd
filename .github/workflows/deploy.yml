name: Deploy NewNetworkingBackend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Docker Compose bor-yo'qligini tekshirish va yo'q bo'lsa GitHub'dan to'g'ridan-to'g'ri o'rnatish
            if ! command -v docker-compose &>/dev/null && ! docker compose version &>/dev/null; then
              echo "Docker Compose topilmadi. Rasmiy GitHub'dan yuklab olinmoqda..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              
              # 'docker compose' (bo'shliq bilan) buyrug'i ham ishlashi uchun tizimga bog'lash
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo ln -s /usr/local/bin/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            # 2. Qaysi buyruq aktivligini aniqlash (bo'shliq yoki chiziqcha bilan)
            if docker compose version &>/dev/null; then
              COMPOSE_CMD="sudo docker compose"
            else
              COMPOSE_CMD="sudo docker-compose"
            fi

            # 3. Serverdagi proyekt papkasiga kirish
            cd /home/ubuntu/app
            
            # 4. GitHub'dan yangi kodlarni majburlab serverga o'tkazish
            git fetch origin main
            git reset --hard origin/main
            
            # 5. Backend papkasiga kirish
            cd NewNetworkingBackend
            
            # 6. Konteynerlarni xatosiz qayta ishga tushirish
            $COMPOSE_CMD -f docker.compose.yml down
            $COMPOSE_CMD -f docker.compose.yml up -d --build
