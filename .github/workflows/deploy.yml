name: Deploy NewNetworkingBackend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Serverdagi proyekt papkasiga kirish
            cd /home/ubuntu/app
            
            # 2. GitHub'dagi yangi kodlarni majburlab serverga o'tkazish
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Backend papkasiga kirish
            cd NewNetworkingBackend
            
            # 4. Standart docker-compose yordamida qayta build qilish
            # (Eski va yangi docker versiyalarida ham xatosiz ishlashi uchun docker-compose ishlatamiz)
            docker-compose down
            docker-compose up -d --build
