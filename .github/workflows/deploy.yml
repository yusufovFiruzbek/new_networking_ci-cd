name: Deploy NewNetworkingBackend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Serverda Docker Compose bor-yo'qligini tekshirish va yo'q bo'lsa avtomatik o'rnatish
            if ! command -v docker-compose &>/dev/null && ! docker compose version &>/dev/null; then
              echo "Docker Compose topilmadi. Tizim uni avtomatik o'rnatmoqda..."
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin docker-compose
            fi

            # 2. Serverda qaysi format (bo'shliq yoki chiziqcha bilan) ishlashini dinamik aniqlash
            if docker compose version &>/dev/null; then
              COMPOSE_CMD="sudo docker compose"
            else
              COMPOSE_CMD="sudo docker-compose"
            fi

            # 3. Serverdagi proyekt papkasiga kirish
            cd /home/ubuntu/app
            
            # 4. GitHub'dan yangi kodlarni majburlab serverga o'tkazish
            git fetch origin main
            git reset --hard origin/main
            
            # 5. Backend papkasiga kirish
            cd NewNetworkingBackend
            
            # 6. Dinamik aniqlangan buyruq orqali konteynerlarni xatosiz qayta ishga tushirish
            $COMPOSE_CMD -f docker.compose.yml down
            $COMPOSE_CMD -f docker.compose.yml up -d --build
